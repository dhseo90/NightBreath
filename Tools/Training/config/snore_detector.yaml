dataset:
  input_dir: ../../Samples/Personal
  feature_columns:
    - rms
    - energy
    - zeroCrossingRate
    - spectralCentroid
    - lowBandEnergy
    - midBandEnergy
    - highBandEnergy
    - duration

labels:
  positive: snore
  negative:
    - bruxismLike
    - silence
    - unknown
    - environmentalNoise
    - movementLike
    - coughLike
    - sleepTalkLike

training:
  min_total_samples: 40
  min_positive_samples: 20
  min_negative_samples: 20
  test_size: 0.25
  random_state: 42
  class_weight: balanced
  threshold: 0.5

output:
  directory: output
  model_filename: snore_model.pkl
  evaluation_json_filename: snore_evaluation.json
  evaluation_markdown_filename: snore_evaluation.md
  feature_export_filename: snore_features.csv
