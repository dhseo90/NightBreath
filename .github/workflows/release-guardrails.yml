name: Release Guardrails

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensing-artifact-guardrails:
    name: Licensing and Artifact Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Block tracked dataset/audio/model artifacts
        run: Tools/Release/audit_tracked_artifacts.sh

      - name: Validate Core ML pre-integration gate
        run: Tools/Training/validate_coreml_integration_gate.sh

      - name: Validate model provenance gate
        run: Tools/Training/validate_model_provenance_gate.sh

      - name: Run model provenance negative test
        run: Tools/Training/test_model_provenance_gate_negative.sh

      - name: Validate README links
        run: Tools/Docs/validate_readme_links.sh

      - name: Audit trademark and affiliation copy
        run: Tools/Release/audit_trademark_copy.sh

      - name: Validate dependency inventory
        run: Tools/Release/validate_dependency_inventory.sh

      - name: Audit public repository privacy
        run: Tools/Release/audit_public_repo_privacy.sh

      - name: Run public repository privacy negative test
        run: Tools/Release/test_public_repo_privacy_negative.sh
